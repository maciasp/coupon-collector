<!DOCTYPE html>


<html>


<head>
    <title>
        Simulation 2, RNG collections
    </title>


    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }


        #overlay {
            top: -5px;
            left: -5px;
            background-color: gray;
            opacity: 0.5;
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            padding-top: 30%;
        }


        #overlay h1 {
            text-align: center;
        }


        .input-label {
            width: 150px;
            display: inline-block;
            margin-top: 3px;
        }


        .section-container {
            border: solid 1px #EEE;
            background: #FAFAFA;
            padding: 3px;
            margin: 3px;
        }


        .section-label {
            text-align: center;
            font-size: 20px;
            width: 100%;
            padding: 3px;
        }


        table {
            border: solid #EEE;
            padding: 3px;


        }


        th {
            background-color: #DDF;
            width: 100px;
        }


        tr:nth-child(odd) {
            background: #FFF;
        }


        td {
            text-align: right;
        }


        .stackable {
            display: inline-block;
        }


        .card-collection {
            margin: 5px;
            border: solid 1px #EEE;
        }


        .card-container {
            display: inline-block;
            margin: 5px;
            text-align: center;
            width: 48px;
        }


        .card {
            border: solid 1px #DDD;
            background: #88F;
            text-align: center;
            border-radius: 5px;
        }
    </style>




    <script>


        const getTicks = {
            minPoint: 0,
            maxPoint: 10,
            maxTicks: 10,
            tickSpacing: 1,
            range: 1,
            niceMin: 1,
            niceMax: 1,
            niceScale(min, max) {
                this.minPoint = min;
                this.maxPoint = max;
                this.calculate();
                return {
                    tickSpacing: this.tickSpacing,
                    niceMinimum: this.niceMin,
                    niceMaximum: this.niceMax
                };
            },
            calculate() {
                this.range = this.niceNum(this.maxPoint - this.minPoint, false);
                this.tickSpacing = this.niceNum(this.range / (this.maxTicks - 1), true);
                this.niceMin = Math.floor(this.minPoint / this.tickSpacing) * this.tickSpacing;
                this.niceMax = Math.ceil(this.maxPoint / this.tickSpacing) * this.tickSpacing;
            },
            niceNum(localRange, round) {
                var exponent; /** exponent of localRange */
                var fraction; /** fractional part of localRange */
                var niceFraction; /** nice, rounded fraction */
                exponent = Math.floor(Math.log10(localRange));
                fraction = localRange / Math.pow(10, exponent);
                if (round) {
                    if (fraction < 1.5) niceFraction = 1;
                    else if (fraction < 3) niceFraction = 2;
                    else if (fraction < 7) niceFraction = 5;
                    else niceFraction = 10;
                } else {
                    if (fraction <= 1) niceFraction = 1;
                    else if (fraction <= 2) niceFraction = 2;
                    else if (fraction <= 5) niceFraction = 5;
                    else niceFraction = 10;
                }
                return niceFraction * Math.pow(10, exponent);
            },
            setMinMaxPoints(localMinPoint, localMaxPoint) {
                this.minPoint = localMinPoint;
                this.maxPoint = localMaxPoint;
                this.calculate();
            },
            setMaxTicks(localMaxTicks) {
                this.maxTicks = localMaxTicks;
                this.calculate();
            }
        }


        function drawDistribution(sizes, canvasName) {


            // Canvas context & dimensions
            const canvas = document.getElementById(canvasName);
            const ctx = canvas.getContext("2d");
            const maxX = canvas.width;
            const maxY = canvas.height;


            // Chart dimensions
            const maximum = sizes.reduce((acc, val) => val = acc > val ? acc : val);
            let minC = 0;
            let maxC = 0;
            sizes.forEach((x, i) => {
                if (x !== 0) {
                    maxC = i;
                    if (minC === 0) { minC = i; }
                }
            });
            const delta = maxC - minC;


            //chart format
            const marginLeft = 80;
            const marginBottom = 30;
            const marginRight = 10;
            const marginTop = 10;
            const resX = (maxX - marginLeft - marginRight) / (delta + 2);
            const resY = (maxY - marginTop - marginBottom) / maximum;
            // Clear imag
            ctx.clearRect(0, 0, maxX, maxY);


            // Draw chart
            ctx.strokeStyle = '#33AAC5';
            ctx.fillStyle = '#2288A5';
            ctx.beginPath();
            sizes.forEach((x, i) => {
                const px = marginLeft + i * resX;
                const py = maxY - x * resY - marginBottom;
                ctx.fillRect(px, py, resX, x * resY);
            })
            ctx.stroke();


            //Chart lines;
            ctx.strokeStyle = '#444444';
            ctx.beginPath();
            ctx.moveTo(marginLeft, marginTop);
            ctx.lineTo(marginLeft, maxY - marginBottom);
            ctx.lineTo(maxX - marginRight + resX, maxY - marginBottom);
            ctx.stroke();


            // Horizontal ticks
            ctx.strokeStyle = '#000000';
            ctx.font = "11px Arial";
            let tickScale = getTicks.niceScale(minC, maxC)
            ctx.beginPath();
            for (let i = tickScale.niceMinimum; i < tickScale.niceMaximum; i += tickScale.tickSpacing) {
                if (i >= minC && i <= maxC) {
                    const left = 5 * Math.trunc(Math.log10(i));
                    ctx.moveTo(marginLeft + (i - minC) * resX, maxY - marginBottom);
                    ctx.lineTo(marginLeft + (i - minC) * resX, maxY - marginBottom + 10);
                    ctx.fillText(i, marginLeft + (i - minC) * resX - left, maxY - marginBottom + 20);
                }
            }
            ctx.stroke();


            // Vertical ticks
            ctx.beginPath();
            tickScale = getTicks.niceScale(0, maximum);
            for (let i = tickScale.niceMinimum; i < tickScale.niceMaximum; i += tickScale.tickSpacing) {
                const left = 20 + 10 * Math.trunc(Math.log10(i));
                ctx.moveTo(marginLeft, maxY - marginBottom - i * resY);
                ctx.lineTo(marginLeft - 10, maxY - marginBottom - i * resY);
                ctx.fillText(i, marginLeft - left, 3 + maxY - marginBottom - i * resY);
            }
            ctx.stroke();
        }


        function start(cards, participants, envelope, sold, alpha) {


            // Initial draw
            // Determine collection sizes as a Pareto / alike distribution
            // alpha is the shape
            // L = 1, H =  participants  // For l=1 alpha*L^alpha = alpha 
            let colSizes = [];
            let collections = [];
            let sum = 0;
            for (let x = 1; x <= participants; x++) {
                const pdf = (alpha * Math.pow(x, alpha - 1)) / (1 - Math.pow(1 / participants, alpha));
                colSizes.push(pdf * envelope * sold);
                sum += pdf;
            }
            // Round to envelope sizes
            colSizes = [...colSizes.map(x => x = envelope * Math.round(x / (sum * envelope)))];
            let globalCollection = Array(cards).fill(0);
            colSizes.forEach((x, i) => {
                let collection = Array(cards).fill(0);
                for (let draw = 0; draw < x; draw++) {
                    const card = Math.trunc(Math.random() * cards);
                    collection[card]++;
                    globalCollection[card]++; // Do this here (Faster)
                };
                collections.push(collection);
            });


            // Collection summaries (starting position)
            let summary = {
                completed: 0,
                prediction: 0,
                unfinished: 0,
                totalCards: 0,
                completable: 0,
                maximum: 0,
                predCompleted: 0
            };
            let colSummaries = [];
            collections.forEach((collection, i) => {
                let complete = true;
                let missing = 0;
                let repeated = 0;
                collection.forEach(card => card === 0 ? (missing++, complete = false) : repeated += card - 1);
                colSummaries.push({
                    collection: i,
                    cards: colSizes[i],
                    complete: complete,
                    repeated: repeated,  // Should equal cards - collection size - missing
                    missing: missing
                });
                complete ? summary.completed++ : summary.unfinished++;
            });
            summary.totalCards = colSizes.reduce((pv, cv) => pv + cv, 0);
            summary.prediction = cards * (Math.log(cards) + 0.57721); //  0.577... is Euler's constant
            summary.maximum = Math.max(...globalCollection);
            summary.completable = Math.min(...globalCollection);
            summary.average = summary.totalCards / cards;
            colSizes.forEach(el => el > summary.prediction ? summary.predCompleted++ : null);


            displayCollections(collections);
            // Collection sizes Distribution chart:
            drawDistribution(colSizes, "chart1");
            // Card frequencies distribution chart:
            drawDistribution(globalCollection, "chart2");
            // Global starting point
            let outputHtml = '<table>';
            outputHtml += '<tr><td>Total Cards:</td><td>' + summary.totalCards + '</td>';
            outputHtml += '<tr><td>Completed:</td><td>' + summary.completed + '</td>';
            outputHtml += '<tr><td>Unfinished:</td><td>' + summary.unfinished + '</td>';
            outputHtml += '<tr><td>Prediction:</td><td>' + summary.prediction.toFixed(2) + '</td>';
            outputHtml += '<tr><td>Prediction Completed:</td><td>' + summary.predCompleted + '</td>';
            outputHtml += '<tr><td>Completable (minimum):</td><td>' + summary.completable + '</td>';
            outputHtml += '<tr><td>Maximum:</td><td>' + summary.maximum + '</td>';
            outputHtml += '<tr><td>Average of each card:</td><td>' + summary.average.toFixed(2) + '</td>';


            outputHtml += '</table>';
            document.getElementById('summary-initial').innerHTML = outputHtml;
            // Starting point per user
            outputHtml = '<table><tr><th>Collection</th><th>Cards</th><th>Completed?</th><th>Repeated</th><th>Missing</th></tr>';
            colSummaries.forEach(collection => {
                outputHtml += '<tr><td>' + collection.collection + '</td>';
                outputHtml += '<td>' + collection.cards + '</td>';
                outputHtml += '<td>' + (collection.complete ? 'yes' : 'no') + '</td>';
                outputHtml += '<td>' + collection.repeated + '</td>';
                outputHtml += '<td>' + collection.missing + '</td></tr>';
            })
            outputHtml += '</table>';
            document.getElementById('collectors-initial').innerHTML = outputHtml;
        }


        function displayCollections(collections) {
            let outputHtml = "<h3>Card collections</h3>";
            collections.forEach((collection, collector) => {
                outputHtml += '<div class="card-collection">';
                outputHtml += `<h5>Collector ${collector}</h5>`;
                let cardsDivs = "";
                let missing = 0; // No need to re-calculate here. However, can be useful to do it this way
                let completed = 0;
                let repeated = 0;
                collection.forEach((count, i) => {
                    cardsDivs += '<div class="card-container">';
                    cardsDivs += count > 0 ? '<div class="card">' : '<div class="card" style="background:#F88">';
                    cardsDivs += `<h3>${i}</h3>`;
                    cardsDivs += '</div>';
                    cardsDivs += count;
                    cardsDivs += '</div>';
                    count > 1 ? (repeated += count - 1, completed++) : count === 0 ? missing++ : completed++;
                })
                outputHtml += `<div>Completed: ${completed} / ${collection.length}. Misssing : ${missing}. Repeated: ${repeated}. Total ${repeated + completed}</div>`;
                outputHtml += cardsDivs + "</div>";
            })
            document.getElementById('card-collections').innerHTML = outputHtml;
        }


        function toggleOverlay(val) {
            document.getElementById('overlay').style.display = val === 'on' ? 'block' : 'none';
            document.body.style.overflow = val === 'on' ? 'hidden' : 'visible';
        }


        function submit() {
            toggleOverlay('on');
            const cards = document.getElementById('cards').value;
            const participants = document.getElementById('participants').value;
            const envelope = document.getElementById('envelope').value;
            const sold = document.getElementById('sold').value;
            const alpha = document.getElementById('alpha').value;
            console.log('Starting simulation with ' + cards + ' cards, and ' + participants + ' participants');
            setTimeout(() => {  // Make sure all dom processes are finished before entering a long loop
                start(parseInt(cards), parseInt(participants), parseInt(envelope), parseInt(sold), parseFloat(alpha));
                console.log('Simulation finished');
                toggleOverlay('off');
            }, 0);
        }


    </script>
</head>


<body>
    <div id="overlay">
        <h1>CALCULATING...</h1>
    </div>
    <div class="section-container">
        <div class="section-label">Simulation values</div>
        <span class="input-label">Cards in collection :</span><input id="cards" type="text" value="100"><br />
        <span class="input-label">Collectors :</span><input id="participants" type="text" value="25"><br />
        <span class="input-label">Cards in envelope :</span><input id="envelope" type="text" value="5"><br />
        <span class="input-label">Envelopes sold :</span><input id="sold" type="text" value="2500"><br />
        <span class="input-label">Shape :</span><input id="alpha" type="text" value="0.2"><br />
        <span class="input-label"></span><span class="input-label"><button onclick="submit()">Launch
                simulation</button></span>
    </div>
    <div class="section-container">
        <div class="section-label">Distribution chart (Size of collections)</div>
        <canvas id="chart1" width="1024" height="400"></canvas>
    </div>
    <div class="section-container">
        <div class="section-label">Card frequencies chart</div>
        <canvas id="chart2" width="1024" height="400"></canvas>
    </div>
    <div class="section-container">
        <div class="stackable">
            <div class="section-label">Collectors initial position</div>
            <div id="collectors-initial"></div>
        </div>
        <div class="stackable">
            <div class="section-label">Global initial summary</div>
            <div id="summary-initial"></div>
        </div>
    </div>
    <div class="section-container">
        <div id="card-collections"></div>
    </div>


</body>


</html>
