<!DOCTYPE html>


<html>


<head>
    <title>
        Simulation 1, Sequential from RNG
    </title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }


        #overlay {
            top: -5px;
            left: -5px;
            background-color: gray;
            opacity: 0.5;
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            padding-top: 30%;
        }


        #overlay h1 {
            text-align: center;
        }

        .input-label {
            width: 150px;
            display: inline-block;
            margin-top: 3px;
        }


        .section-container {
            border: solid 1px #EEE;
            background: #FAFAFA;
            padding: 3px;
            margin: 3px;
        }


        .section-label {
            text-align: center;
            font-size: 20px;
            width: 100%;
            padding: 3px;
        }


        table {
            border: solid #EEE;
            padding: 3px;
        }

        tr:nth-child(odd) {
            background: #FFF;
        }

        tr{
            border-bottom: solid 1px #888;
        }


        td {
            text-align: right;
            padding: 2px,8px,2px,2px;
            border-right: solid 1px #888;
        }


        .table-header{

        }

        .table-header td {
            padding: 2px, 8px, 2px, 8px;
            text-align: right;
            font-weight: bold;            
            background-color: #CDF;
        }


    </style>
    <script>
        function clearResults(){
            document.getElementById('results-layer').innerHTML="";
        }
        
        function toggleOverlay(val) {
            document.getElementById('overlay').style.display = val === 'on' ? 'block' : 'none';
            document.body.style.overflow = val === 'on' ? 'hidden' : 'visible';
        }

        function createTable(data){            
            let tableContent='<table><tr class="table-header"><td>i</td><td>Collection Size</td><td>Cards (Average)</td><td>Cards per collector</td></tr>';
            data.forEach((d,i)=>{tableContent+=`<tr><td>${i}</td><td>${d.collectionSize}</td>
                <td>${parseFloat(d.averageExtracted).toFixed(2)}</td><td>${parseFloat(d.averageExtracted / d.collectors).toFixed(2)}</td></tr>`;});
            tableContent+="</table>";
            document.getElementById('results-layer').innerHTML+=`<h4>Iterations : ${data[0].iterations}, ${data[0].collectors} collectors</h4> ${tableContent}`;            
        }

        function areComplete (collection, collections){
            const isEnough = (currentValue) => currentValue >= collections;
            return collection.every(isEnough);
        }

        function collect (collectionSize, collections){
            let collectionsArray = new Array (collectionSize).fill(0);            
            do {
              collectionsArray[Math.trunc (Math.random()*collectionSize)]++ 
            } while (!areComplete(collectionsArray, collections));
            return (collectionsArray);
        }

        function start(iterations, minCards, maxCards, maxCollections){
            let results = [];
            for (let collectionSize = minCards; collectionSize<=maxCards; collectionSize++){
                let sum=0;
                for (let i=0; i<iterations;i++){                    
                    let collection = collect (collectionSize,maxCollections);
                    let cardsExtracted = collection.reduce ((acc,cval)=>acc+cval);
                    //console.log (collection);                    
                    //console.log ('Collection size: '+collectionSize+' Collectors: '+maxCollections+' Iteration: '+i+' Extracted: '+cardsExtracted);
                    sum+=cardsExtracted;
                }
                results.push ({
                    "collectionSize" : collectionSize,
                    "collectors" : maxCollections,
                    "iterations" : iterations,
                    "averageExtracted" : sum / iterations                    
                })
            }
            console.log ("Simulation finished");
            console.log (results);
            createTable (results);            
        }
        

        function submit() {
            let resultsVector = {};
            let resultsArray =[];
            toggleOverlay('on');
            // Read data from the form. No validation            
            const minCards =document.getElementById('mincards').value;
            const maxCards = document.getElementById('maxcards').value;
            const maxCollections = document.getElementById('maxcollections').value;
            const iterations = document.getElementById('iterations').value;
            // Launch the simulation
            console.log('Starting simulation with ' + maxCards + ' cards, and ' + maxCollections + ' collections');
            setTimeout(() => {  // Make sure all dom processes are finished before entering a long loop
                start(parseInt(iterations), parseInt(minCards),parseInt(maxCards), parseInt(maxCollections));
                console.log('Simulation finished');
                toggleOverlay('off');
            }, 0);
        }

     </script>
</head>


<body>
    <div id="overlay">
        <h1>CALCULATING...</h1>
    </div>
    <div class="section-container">
        <div class="section-label">Simulation values</div> 
        <span class="input-label">Iterations :</span><input id="iterations" type="text" value="10"><br />
        <span class="input-label">Min. Cards :</span><input id="mincards" type="text" value="5"><br />
        <span class="input-label">Max. Cards :</span><input id="maxcards" type="text" value="10"><br />
        <span class="input-label">Max. Collections :</span><input id="maxcollections" type="text" value="10"><br />

        <span class="input-label"></span><span class="input-label"><button onclick="submit()">Launch
                simulation</button></span>
    </div>

    <span class="input-label"><button onclick="clearResults()">Clear Results</button></span>
    <div id="results-layer">

    </div>

</body>
